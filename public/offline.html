<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f3ed" />
    <title>PWA Ticket · การเชื่อมต่อขัดข้อง</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f3ed; color: #172522; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 420px; padding: 40px 28px; text-align: center; }
      .mark { width: 52px; height: 52px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 18px; background: #ef7955; color: white; font-weight: 800; }
      h1 { margin: 0 0 12px; font-size: 30px; line-height: 1.1; letter-spacing: -.04em; }
      p { color: #66716d; }
      a { display: inline-block; margin-top: 18px; padding: 12px 20px; border-radius: 999px; background: #172522; color: white; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">PW</div>
      <h1>อุปกรณ์นี้ยังไม่มีอินเทอร์เน็ต</h1>
      <p>กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองอีกครั้ง</p>
      <a href="/">ลองเปิดอีกครั้ง</a>
    </main>
  </body>
</html>
